<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Georgia, serif">
  <rect width="800" height="470" fill="#fbf7f0"/>
  <text x="400" y="44" text-anchor="middle" font-size="26" fill="#16130f">How Shiras Ha'azinu Is Written</text>
  <text x="400" y="70" text-anchor="middle" font-size="15" fill="#8b8073">Two columns, seventy lines — אריח על גבי אריח</text>
  <rect x="210" y="95" width="380" height="300" fill="#fffdf8" stroke="#c9bda4" stroke-width="2"/>
  <g fill="#3c342a">
    <g id="rows">
      <rect x="240" y="120" width="140" height="11" rx="3" fill="#dfd4bd"/><rect x="420" y="120" width="140" height="11" rx="3" fill="#dfd4bd"/>
      <rect x="240" y="145" width="140" height="11" rx="3" fill="#dfd4bd"/><rect x="420" y="145" width="140" height="11" rx="3" fill="#dfd4bd"/>
      <rect x="240" y="170" width="140" height="11" rx="3" fill="#dfd4bd"/><rect x="420" y="170" width="140" height="11" rx="3" fill="#dfd4bd"/>
      <rect x="240" y="195" width="140" height="11" rx="3" fill="#dfd4bd"/><rect x="420" y="195" width="140" height="11" rx="3" fill="#dfd4bd"/>
      <rect x="240" y="220" width="140" height="11" rx="3" fill="#dfd4bd"/><rect x="420" y="220" width="140" height="11" rx="3" fill="#dfd4bd"/>
      <rect x="240" y="245" width="140" height="11" rx="3" fill="#dfd4bd"/><rect x="420" y="245" width="140" height="11" rx="3" fill="#dfd4bd"/>
      <rect x="240" y="270" width="140" height="11" rx="3" fill="#dfd4bd"/><rect x="420" y="270" width="140" height="11" rx="3" fill="#dfd4bd"/>
      <rect x="240" y="295" width="140" height="11" rx="3" fill="#dfd4bd"/><rect x="420" y="295" width="140" height="11" rx="3" fill="#dfd4bd"/>
      <rect x="240" y="320" width="140" height="11" rx="3" fill="#dfd4bd"/><rect x="420" y="320" width="140" height="11" rx="3" fill="#dfd4bd"/>
      <rect x="240" y="345" width="140" height="11" rx="3" fill="#dfd4bd"/><rect x="420" y="345" width="140" height="11" rx="3" fill="#dfd4bd"/>
    </g>
  </g>
  <line x1="400" y1="110" x2="400" y2="380" stroke="#1e6b5e" stroke-dasharray="5 5"/>
  <text x="400" y="400" text-anchor="middle" font-size="13" fill="#164f46">blank space down the middle</text>
  <text x="210" y="432" font-size="15" fill="#4a4239">Unlike Shiras HaYam (Beshalach), which is written like a wall of bricks</text>
  <text x="210" y="454" font-size="15" fill="#4a4239">with staggered gaps, Ha'azinu runs as two clean parallel columns.</text>
</svg>
